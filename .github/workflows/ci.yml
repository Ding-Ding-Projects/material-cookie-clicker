name: CI

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record runner and dependency inventory
        shell: pwsh
        run: |
          "Runner OS: $env:RUNNER_OS"
          "Runner architecture: $env:RUNNER_ARCH"
          git --version
          node --version
          npm --version
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'The GitHub-hosted runner does not match the required Windows X64 environment.' }
      - name: Install locked dependencies from a cache-miss-safe state
        run: npm ci
      - name: Build renderer, main process, and preload
        run: npm run build
      - name: Reproduce the release line-count table
        continue-on-error: true
        run: npm run count:lines
      - name: Collect build evidence
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path workflow-evidence -Force | Out-Null
          $context = [ordered]@{
            runId = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA
            ref = $env:GITHUB_REF
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
          }
          $context | ConvertTo-Json | Set-Content -LiteralPath workflow-evidence/context.json -Encoding utf8
          if (Test-Path -LiteralPath dist) { Copy-Item -LiteralPath dist -Destination workflow-evidence/dist -Recurse -Force }
          npm run count:lines *> workflow-evidence/line-count.md
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ci-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: workflow-evidence
          if-no-files-found: warn
          retention-days: 7
